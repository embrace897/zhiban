="bold" fill="#174C64">通知箱</text><text x="176" y="822" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">事务</text><text x="253" y="822" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">助手</text><text x="330" y="822" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">我的</text></g></svg>