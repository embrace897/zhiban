<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>S02-上传通知</title><g id="S02-上传通知"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FA" stroke="none"/><rect x="0" y="0" width="390" height="145" rx="0" fill="#174C64" stroke="none"/><text x="24" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#FFFFFF">9:41</text><text x="302" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF">5G  100%</text><text x="22" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="normal" fill="#FFFFFF">‹</text><text x="50" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">收集通知</text><text x="24" y="111" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#CFE8ED">从一张截图开始</text><g id="card-1"><rect x="20" y="165" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="181" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">选择通知内容</text><text x="36" y="220" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">＋ 上传截图     PDF文件     粘贴文字</text></g><g id="card-2"><rect x="20" y="289" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="305" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">通知来源</text><text x="36" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">班级群 · 用户主动提供</text></g><g id="card-3"><rect x="20" y="413" width="350" height="112" rx="14" fill="#FFF