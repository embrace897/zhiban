<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>S09-我的记忆</title><g id="S09-我的记忆"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FA" stroke="none"/><rect x="0" y="0" width="390" height="145" rx="0" fill="#174C64" stroke="none"/><text x="24" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#FFFFFF">9:41</text><text x="302" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF">5G  100%</text><text x="22" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="normal" fill="#FFFFFF">‹</text><text x="50" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">我的</text><text x="24" y="111" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#CFE8ED">由你决定，知办记住什么</text><g id="card-1"><rect x="20" y="165" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="181" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">个人资料</text><text x="36" y="220" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">大二 · 计算机专业</text><text x="36" y="242" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">仅用于你授权的事务处理</text></g><g id="card-2"><rect x="20" y="289" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="305" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">长期时间偏好</text><text x="36" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">每天20:00后可用30分钟</text><text x="36" y="366" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">已确认 · 可编辑 / 停用 / 删除</text></g><g id="card-3"><rect x="20" y="413" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="429" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="442" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">记忆来源</text><text x="36" y="468" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">来自11/22对话，由本人确认保存</text><text x="36" y="490" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">“今晚没空”不会自动变成长期偏好</text></g><g id="card-4"><rect x="20" y="537" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="553" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="566" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">管理与隐私</text><text x="36" y="592" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">我的文件与数据     内部消息</text><text x="36" y="614" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">资料维护入口（仅维护角色）</text></g><g id="primary-action"><rect x="20" y="685" width="350" height="46" rx="12" fill="#174C64" stroke="none"/><text x="38" y="714" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">管理长期记忆</text><text x="341" y="714" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="normal" fill="#FFFFFF">→</text></g><text x="22" y="751" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="10" font-weight="normal" fill="#71818D">删除记忆与删除聊天记录是不同操作</text><rect x="0" y="790" w