<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>S09-我的记忆</title><g id="S09-我的记忆"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F7FA" stroke="none"/><rect x="0" y="0" width="390" height="145" rx="0" fill="#174C64" stroke="none"/><text x="24" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#FFFFFF">9:41</text><text x="302" y="27" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF">5G  100%</text><text x="22" y="70" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="normal" fill="#FFFFFF">‹</text><text x="50" y="69" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">我的</text><text x="24" y="111" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#CFE8ED">由你决定，知办记住什么</text><g id="card-1"><rect x="20" y="165" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="181" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="194" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">个人资料</text><text x="36" y="220" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">大二 · 计算机专业</text><text x="36" y="242" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="normal" fill="#71818D">仅用于你授权的事务处理</text></g><g id="card-2"><rect x="20" y="289" width="350" height="112" rx="14" fill="#FFFFFF" stroke="none"/><rect x="20" y="305" width="4" height="18" rx="2" fill="#128778" stroke="none"/><text x="36" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#203747">长期时间偏好</text><text x="36" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-w